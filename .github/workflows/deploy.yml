name: Build and Deploy to Hostpoint

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Dependencies and Build App
      run: |
        npm ci
        npm run build

    - name: SCP Deploy Production Files
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 'sl2679.web.hostpoint.ch'
        username: 'gazazoze'
        key: ${{ secrets.HOSTPOINT_SSH_KEY }}
        port: 22
        source: 'dist/*'
        target: 'www/autoreinigung.meisterflow.ch/'
        strip_components: 1